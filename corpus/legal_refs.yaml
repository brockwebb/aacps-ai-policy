# corpus/legal_refs.yaml: AP-02 Part B. The machine-fetchable legal references named in draft Policy DM's footer
# ("Legal References", page 2), and the ones cataloged without their full texts.
#
# `fetch` units are pulled by scripts/fetch_legal_refs.py into corpus/inbox/ with a receipt per unit in
# corpus/legal_refs_receipts.jsonl (url, final url, retrieval time, HTTP status, content type, sha256, bytes), the
# same fields the browser-acquired candidates carry. `catalog_only` entries are recorded as `reference` with their
# canonical citations: the draft cites them as general compliance and no anchor in DN-002 needs a specific section
# (AP-02 Part B; admit a section later only if an anchor query needs it).
#
# Edition pins: eCFR is an unofficial compilation, so every CFR unit names the date it is current as of, read from
# https://www.ecfr.gov/api/versioner/v1/titles.json on 2026-11-01 (titles 16, 34, 47: up_to_date_as_of 2026-10-29).
# The statute units use GovInfo's link service, which resolves to the latest published US Code edition (USCODE-2024
# on 2026-11-01); the receipt records the edition URL it resolved to.

network:
  # The task's Network line (AP-02). The fetcher refuses any other host, before and after redirects.
  allowlist: [www.ecfr.gov, ecfr.gov, www.govinfo.gov, govinfo.gov, uscode.house.gov, www.law.cornell.edu, github.com]
  user_agent: "aacps-ai-policy corpus fetcher (public legal texts; https://github.com/brockwebb)"
  timeout_seconds: 60
  inter_request_delay_seconds: 1.0     # polite pacing; eCFR and GovInfo publish no lower bound for a handful of pulls
  retry_attempts: 3                    # factory/control.yaml retry.attempts
  retry_backoff_seconds: 5

inbox_dir: corpus/inbox
receipts: corpus/legal_refs_receipts.jsonl

