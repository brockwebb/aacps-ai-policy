# graphs/aacps-policy-dm/graph.yaml: THE ONE FILE (squiddy K-001) for the AACPS Policy DM corpus graph.
# AP-01 (cc_tasks/2026-10-31_AP-01_scope_corpus_and_graph_spec.md) Part C. Second squiddy consumer after
# hazbrief-mcp; shape adapted from ../../../hazbrief-mcp/graphs/hazbrief-corpus/graph.yaml with every
# hazmat-specific block removed (vocabularies, claim overlay, concept layer, extraction roles).
#
# Schema reuse (repo CLAUDE.md): the fss-policy-kg classes Document, Definition, Obligation, Reference and
# Conflict. The kit's base schema has no Obligation, Definition or Conflict class (squiddy schema/base.yaml
# lists Work, Claim, Ruling, Concept, ExternalReference, Cites, Supersedes and others), and fss-policy-kg
# keeps its classes in Neo4j labels, not in a LinkML file. So: Document = the kit's Work (same role: one
# admitted source document); Reference = the kit's ExternalReference; Obligation, Definition and Conflict
# are declared on their own lines below with their fss meaning. The mapping and why are in
# docs/design/2026-10-31_DN-001_scope.md section 4.
#
# Extraction was CLOSED by AP-01 (squiddy CONOPS R-106). AP-02 opens it for this graph (its Part C: "valve opened for
# this graph; DN-001 kept it closed until there was a corpus"); the downstream test that earns it is DN-002's eight
# anchors, which need Obligations and Definitions to confirm or refute. The extraction design, the prompt's prior art
# and the conflict pass are docs/design/2026-11-01_DN-003_extraction_and_conflict_pass.md.
spec_version: 1
name: aacps_policy_dm
title: the AACPS Policy DM corpus graph
description: >-
  The draft AACPS Board Policy DM, Responsible Use of Artificial Intelligence (October 2026), the public
  documents it cites or is bound by, and the public meeting records of its adoption. Each document is held
  with its url, sha256 and retrieval date, or recorded as metadata only with the reason.
scope:
  topic: >-
    The draft policy, what it cites, what governs it (Maryland State Department of Education guidance,
    federal student-privacy and child-online-safety regulation, AACPS policies it references), and the
    public meeting records of its adoption; nothing else (DN-001 section 1).
version: 0.1.0
license: MIT
store: ledger
policy: public_only
serve:
  backend: export
intake:
  # AP-02: the kit resolves the glob against the graph directory, and the hand-written corpus/candidates/*.yaml are not
  # the catalog's shape (two are bare lists), so the catalog reads the file scripts/build_admission_candidates.py
  # generates from them. `sha256` is the held text's hash: a changed file is a revision.
  - {source: candidates, files: ["../../corpus/admission/candidates.yaml"], content_fields: [sha256, withheld_reason]}
classes:
  - Work: Node                       # fss "Document"
  - ExternalReference: Node          # fss "Reference"
  - Cites: Edge                      # (Work)-[:CITES]->(Work | ExternalReference)
  - Supersedes: Edge                 # a newer edition replaces an older (MSDE guidance has two versions)
  - name: Obligation
    is_a: Node
    description: >-
      One sentence a document states as an obligation, prohibition, permission or recommendation, with its
      deontic force and the party it binds (fss-policy-kg Obligation). Declared here because the kit's base
      schema does not carry it.
    slots: [text]
    slot_usage:
      text: {required: true}
    attributes:
      force:
        description: >-
          obligation | prohibition | permission | recommendation (fss-policy-kg's closed vocabulary). The spec cannot
          declare an enum (the kit takes enums from its base schema only), so the extraction protocol enforces it:
          a row with any other value is recorded `ungrounded` with the reason and never emitted.
      binds:
        description: The party the statement binds, as the text names it (fss "addressee"), or null when it names none.
      responsible_party_stated:
        range: boolean
        description: >-
          Whether the sentence or its section names who must act (DN-001 anchor 3, obligations without mechanism).
      mechanism_stated:
        description: >-
          The process, timeline or consequence the text attaches, quoted, or null (DN-001 anchor 3).
      section_path:
      page:
        range: integer
  - name: Definition
    is_a: Node
    description: >-
      A defined term and its definition as one document states it (fss-policy-kg Definition). Two
      Definitions of one term in two documents are the raw material of a definitional-consistency finding.
    slots: [text]
    slot_usage:
      text: {required: true}
    attributes:
      term:
        required: true
      section_path:
      page:
        range: integer
  - name: StatedIn                   # (Obligation | Definition)-[:STATED_IN]->(Work)
    is_a: Edge
    description: >-
      (Obligation | Definition)-[:STATED_IN]->(Work): the document a statement was extracted from, with its located
      span. fss-policy-kg ties an Obligation to its document through Segment and a `source_doc` property; this graph
      holds no Segment nodes (the parsed intermediate is the segment record), so the tie is one edge. The kit's
      Asserts edge is not declared here because its range is Claim. Recorded in DN-003 section 2.
  - name: Conflict
    is_a: Node
    description: >-
      An adjudicated conflict between two Obligations or Definitions, with the rationale and the criteria
      version (fss-policy-kg CONFLICTS_WITH overlay, reified as a node so the verdict can carry its reason).
    slots: [text]
    slot_usage:
      text: {required: true}
    attributes:
      criteria_version:
      verdict:
        description: apparent_resolved | genuine_conflict (fss-policy-kg kg/conflict_rubric.md; no_conflict is not a node)
      resolution_basis:
        description: specificity | temporality | hierarchy | exception_clause, when the verdict is apparent_resolved
      confidence:
        range: float
  - name: ConflictsWith              # (Conflict)-[:CONFLICTS_WITH]->(Obligation | Definition)
    is_a: Edge
    description: >-
      (Conflict)-[:CONFLICTS_WITH]->(Obligation | Definition): one of the two statements a Conflict
      adjudicates (fss-policy-kg CONFLICTS_WITH). Declared here because the kit's base schema has no
      conflict edge.
    attributes:
      side:
        description: "a or b: which of the two conflicting statements this edge points at."
emit:
  - metadata_document:
      fields:
        common: [id, kind, title, source_url, disposition, cited_in]
        work: [publisher, doc_type, access, licence_basis, raw_sha256, withheld_reason]
      citation_lines: false
parse:
  # .txt goes to the kit's own markdown reader (plain prose; Educ. 4-131 is the one), not to docling
  markdown_suffixes: [".md", ".markdown", ".mdown", ".txt"]
extract:
  enabled: true
  # DN-003: this graph's own protocol (squiddy `extract.graph_protocol`, SQ-021): one call per section-bounded unit of
  # the parsed intermediate, items located verbatim in it, rows emitted by emit.py `emit_extraction`
  protocol: extract_protocol.py
  roles:
    extractor: extractor             # seldon registry roles (MODEL-001), never a model id: sonnet, effort medium
    rater: rater
    adjudicator: adjudicator         # opus: the conflict pass (scripts/conflict_pass.py)
domain:
  extract:
    # DN-003 section 3: the protocol's instrument. The prompt is versioned by its file and hashed into every unit key,
    # so a changed prompt is a new extraction, never a stale reuse.
    prompt_file: prompts/extract_v1.md
    prompt_version: extract_v1
    # a unit is consecutive parsed blocks up to this many characters, cut at a heading where it can be (fss lesson:
    # the section is the citable unit, and a definitions heading must not be split from its body)
    unit_max_chars: 6000
    citation_aliases: ../../corpus/admission/citation_aliases.yaml
  conflicts:
    # DN-003 section 4: pairs with a draft statement on one side, adjudicated under fss-policy-kg's rubric
    anchor_doc: aacps-policy-dm-draft
    verdicts: evidence/conflicts/verdicts.jsonl
    rubric_file: prompts/conflict_rubric_v1.md
    criteria_version: fss-conflict-rubric+aacps-v1
